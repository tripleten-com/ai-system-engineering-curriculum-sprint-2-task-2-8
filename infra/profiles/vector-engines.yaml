# Coldline - Task 2.8
# File: infra/profiles/vector-engines.yaml
# Component: Vector engine technical profiles
# Purpose: State the architectural facts the Task 2.8 classifications are graded against.
# Interacts With: docs/architecture/vector-engines.md and the attribution checks
# Sprint/Task: Sprint 2 - Project 2 / Task 2.8
# Concepts: Storage layout, filtering mechanism, operational footprint
# Tools: YAML

# These profiles are the graded source. The checks compare a recorded
# classification with the `storage_layout` recorded here, not with anything a
# model or a search engine might say about these products: a Task must not grade
# a student against knowledge it did not supply.
#
# The prose in docs/architecture/vector-engines.md says the same things at
# length. If the two ever disagree, this file is the one the checks read, and
# the disagreement is a defect in the Task rather than in a submission.

schema_version: 2

# Both profiles describe the same retrieval need under the same declared
# deployment assumptions. Comparing engines against different needs, or against
# undisclosed assumptions, produces a conclusion about the assumptions rather
# than about the engines.
retrieval_need: >-
  Hybrid retrieval over a tenant-partitioned corpus of procedural documents:
  dense similarity and full-text search over the same chunks, an access
  predicate applied at query time rather than to the results, and per-stage
  evidence recoverable for one query.
deployment_assumptions:
  - A single write-primary datastore already owns the documents and chunks.
  - One deployment environment; no multi-region or cross-account topology.
  - Corpus scale in the thousands of chunks, not the millions.
  - The access predicate must be enforced inside the search, not after it.
  - Operational ownership is one small team, not a dedicated platform group.

# The two layout patterns this Task distinguishes. A profile's storage_layout
# must be one of these codes.
storage_layouts:
  integrated_relational_table: >-
    Vector embeddings live as typed columns inside relational rows, alongside
    the transactional entity data they belong to. One schema, one query
    planner, one durability and backup boundary.
  dedicated_vector_payload_store: >-
    Vectors and their metadata payloads live in collections maintained by a
    service built for similarity search. The vector store is a separate system
    from whichever database owns the entities.

engines:
  pgvector:
    display_name: PostgreSQL with the pgvector extension
    # This is the engine this repository actually runs; see compose.yaml.
    deployed_here: true
    version: PostgreSQL 16 with pgvector, from pgvector/pgvector:pg16
    digest: sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    source_references:
      - infra/postgres/002_retrieval_corpus.sql, for the declared vector column.
      - src/adapters/retriever/postgres_hybrid.py, for both query arms.
      - compose.yaml, for the pinned image.
      - The pgvector extension README, for the vector type and its operators.
    storage_layout: integrated_relational_table
    evidence: >-
      infra/postgres/002_retrieval_corpus.sql declares `embedding vector(64)`
      as a column of the `chunks` table, beside `chunk_text`, `tenant_id`, and
      the provenance columns. The vector is an attribute of a relational row.
    filtering_mechanism: >-
      One query plan. The access predicate and the distance ordering are
      expressed in the same SQL statement, so the planner decides how to
      combine them. That is what makes the Task 2.4 constraint a query-time
      filter rather than a post-filter.
    operational_footprint: >-
      One datastore to run, back up, and restore. The embeddings are inside the
      same transaction boundary as the documents, so a restore cannot recover
      one without the other.
    backup_and_restore: >-
      One backup covers documents, chunks, and vectors together, and one
      restore returns them to a single consistent point. A schema migration
      covers all of them at once; see migrations/ and the Alembic baseline.
    synchronization: >-
      None to own. The vectors are columns of the rows they describe, so there
      is no second copy to keep in step and no reindex-after-write path.
  qdrant:
    display_name: Qdrant
    # Not installed, not deployed, and not required by this Task. The
    # comparison is a reading exercise against this profile.
    deployed_here: false
    version: >-
      Described from the Qdrant 1.x documented data model. No version is pinned
      because nothing in this repository runs it, and no behavior below was
      observed in a running cluster.
    source_references:
      - Qdrant documentation: collections, points, and payloads.
      - Qdrant documentation: filtering with payload conditions.
      - Qdrant documentation: snapshots, and collection backup and recovery.
    storage_layout: dedicated_vector_payload_store
    evidence: >-
      Qdrant organizes data into collections of points, where each point
      carries a vector and a JSON payload. There is no relational schema and no
      SQL planner; the collection exists to serve similarity search over those
      points.
    filtering_mechanism: >-
      Payload conditions are evaluated against the point payload, either during
      index traversal or as a separate stage around it. The filter and the
      distance search are parts of one vector-search request rather than of one
      relational plan.
    operational_footprint: >-
      A second service to run alongside whichever database owns the entities:
      its own cluster, its own snapshot and restore lifecycle, and a
      synchronization path to keep its points consistent with the source of
      truth.

    backup_and_restore: >-
      Two independent lifecycles. A collection snapshot and the entity
      database's own backup are taken and restored separately, so a restore has
      to reconcile the point in time each of them came from.
    synchronization: >-
      Owned by the application. Every write to the source of truth needs a
      matching upsert or delete against the collection, plus a way to detect
      and repair divergence after a partial failure or a reindex.

# Release gate, per ADR009-R07: CME independently verifies both profiles and the
# accepted answers before release.
qualification:
  status: proposed
  confirmed_by_cme: false

# What this comparison is not. Recording it here keeps the Task from implying a
# recommendation it does not make and cannot support.
limits:
  - No performance, scale, recall, or cost claim is made about either engine.
  - >-
    No preference is graded. Both layouts are legitimate engineering choices,
    and this Task asks only which layout each engine implements.
  - >-
    Nothing here was measured. The pgvector rows are read from this
    repository's own schema; the Qdrant rows describe its documented data model
    and were not observed in a running system.
  - >-
    No Qdrant installation is required, expected, or graded, and no deployment
    assumption beyond the declared list above is relied on.
